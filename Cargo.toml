[package]
name = "minimenta"
version = "0.1.0"
edition = "2024"
# 1.88 is the oldest Rust that builds minimenta. ratatui 0.30, the let chains
# and `slice::as_chunks` need it.
rust-version = "1.88"
# `mm` is a short name for the same program.
default-run = "minimenta"
authors = ["Michael Herland Valen"]
description = "Minuere impedimenta: an interactive disk usage analyzer for the terminal"
license = "MIT OR Apache-2.0"
repository = "https://github.com/OriginalMHV/minimenta"
homepage = "https://github.com/OriginalMHV/minimenta"
readme = "README.md"
keywords = ["disk", "usage", "ncdu", "tui", "cli"]
categories = ["command-line-utilities", "filesystem"]
# Images, benchmarks and CI files stay out of the package. crates.io rewrites
# the relative image paths in the README to the repository on GitHub.
include = [
    "/src",
    "/Cargo.lock",
    "/CHANGELOG.md",
    "/LICENSE-APACHE",
    "/LICENSE-MIT",
    "/README.md",
]

[dependencies]
libc = "0.2.190"
mimalloc = { version = "0.1.52", optional = true }
ratatui = "0.30.2"
rayon = "1.12.0"

# macOS uses its own code in src/ui/trash.rs, so it does not link Foundation.
[target.'cfg(not(target_os = "macos"))'.dependencies]
trash = "5.2.9"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security"] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

# dist builds the release archives with this profile. `dist init` suggests thin
# LTO, but minimenta is a performance tool and keeps fat LTO.
[profile.dist]
inherits = "release"

# Skip mimalloc, so the docs build needs no C compiler.
[package.metadata.docs.rs]
no-default-features = true

[features]
# mimalloc was 2% to 3% faster than the system allocator on a warm scan on
# all three CI platforms. Build with --no-default-features to leave it out.
default = ["mimalloc"]
mimalloc = ["dep:mimalloc"]

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Sizes, counts and offsets from the file system and the kernel fit the
# target types. Where a value can be out of range, the code uses try_from.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
# Pairs such as name_start and name_len are clear in context.
similar_names = "allow"
