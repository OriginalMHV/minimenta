name: Package

# Proves that the crate packages and builds on Linux with the default features,
# the same way scripts/release.sh does in its package dry run before it
# publishes to crates.io. A failure at release time comes after the GitHub
# release is public.
#
# The docs job builds the documentation the way docs.rs does, without mimalloc.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  package:
    name: Package the crate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo publish --dry-run --locked

  docs:
    name: Build the documentation
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - run: cargo doc --no-default-features --no-deps --locked
