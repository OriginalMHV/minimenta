# release.yml calls this workflow as a custom publish job of dist.
#
# crates.io checks the workflow file that starts the run, so the trusted
# publisher entry on crates.io names release.yml, not this file.
#
# The workflow has two jobs. The verify job builds the package. Build scripts
# and proc macros of the dependencies run in that job, so it has no id-token
# permission. The publish job can ask GitHub for an OIDC token, so it runs no
# dependency code. It uses cargo publish with --no-verify and actions that are
# pinned to a commit.
#
# The workflow skips a version that crates.io already has. The first version is
# published by hand, because trusted publishing needs a crate that exists.
# RELEASING.md describes the procedure.
name: Publish to crates.io

on:
  workflow_call:
    inputs:
      plan:
        description: The release plan of dist, as JSON
        required: true
        type: string

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Check the version and build the package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      published: ${{ steps.index.outputs.published }}
    env:
      PLAN: ${{ inputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the version
        id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "minimenta") | .version')
          planned=$(jq -r '.releases[] | select(.app_name == "minimenta") | .app_version' <<< "$PLAN")
          if [ "$version" != "$planned" ]; then
            echo "::error::Cargo.toml has version $version, but the release plan has $planned."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check whether crates.io has this version
        id: index
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # The sparse index lists every version of a crate, also yanked ones.
          status=$(curl -sS -o "$RUNNER_TEMP/index.json" -w '%{http_code}' https://index.crates.io/mi/ni/minimenta)
          case "$status" in
            200)
              versions=$(jq -r '.vers' "$RUNNER_TEMP/index.json")
              if grep -Fxq -- "$VERSION" <<< "$versions"; then
                echo "published=true" >> "$GITHUB_OUTPUT"
                echo "::notice::minimenta $VERSION is already on crates.io. The workflow publishes nothing."
              else
                echo "published=false" >> "$GITHUB_OUTPUT"
              fi
              ;;
            404)
              echo "published=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::The crates.io index answered with HTTP $status."
              exit 1
              ;;
          esac
      - name: Build the package
        if: steps.index.outputs.published == 'false'
        run: cargo publish --dry-run --locked

  publish:
    name: Publish to crates.io
    needs: verify
    if: needs.verify.outputs.published == 'false'
    runs-on: ubuntu-latest
    # Give the environment required reviewers, and enter its name in the
    # trusted publisher entry on crates.io. RELEASING.md has the steps.
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Get a short-lived crates.io token
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        # The verify job built the package already. --no-verify keeps the build
        # scripts of the dependencies out of this job.
        run: cargo publish --locked --no-verify
