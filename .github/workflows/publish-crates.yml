# release.yml calls this workflow as a custom publish job of dist.
#
# crates.io checks the workflow file that starts the run, so the trusted
# publisher entry on crates.io names release.yml, not this file.
#
# The job skips a version that crates.io already has. The first version is
# published by hand, because trusted publishing needs a crate that exists.
# RELEASING.md describes the procedure.
name: Publish to crates.io

on:
  workflow_call:
    inputs:
      plan:
        description: The release plan of dist, as JSON
        required: true
        type: string

defaults:
  run:
    shell: bash

jobs:
  publish:
    runs-on: ubuntu-latest
    # The environment is optional on crates.io. A reviewer rule on the
    # environment adds a manual approval before the publish.
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      PLAN: ${{ inputs.plan }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Read the version
        id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "minimenta") | .version')
          planned=$(jq -r '.releases[] | select(.app_name == "minimenta") | .app_version' <<< "$PLAN")
          if [ "$version" != "$planned" ]; then
            echo "::error::Cargo.toml has version $version, but the release plan has $planned."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check whether crates.io has this version
        id: index
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # The sparse index lists every version of a crate, also yanked ones.
          status=$(curl -sS -o index.json -w '%{http_code}' https://index.crates.io/mi/ni/minimenta)
          case "$status" in
            200)
              versions=$(jq -r '.vers' index.json)
              if grep -Fxq -- "$VERSION" <<< "$versions"; then
                echo "published=true" >> "$GITHUB_OUTPUT"
                echo "::notice::minimenta $VERSION is already on crates.io. The job publishes nothing."
              else
                echo "published=false" >> "$GITHUB_OUTPUT"
              fi
              ;;
            404)
              echo "published=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::The crates.io index answered with HTTP $status."
              exit 1
              ;;
          esac
      - name: Get a short-lived crates.io token
        if: steps.index.outputs.published == 'false'
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish
        if: steps.index.outputs.published == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked
