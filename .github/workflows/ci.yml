name: CI

on:
  push:
    branches: [main]
  pull_request:

# An explicit bash shell runs with -eo pipefail, so `cmd | tee` fails when cmd fails.
defaults:
  run:
    shell: bash

jobs:
  check:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # GitHub's macOS runners have no endpoint security agent, so this measures
  # the scanner itself rather than per-open inspection overhead.
  benchmark:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: brew install ncdu
      - run: bench/throughput.sh "$RUNNER_TEMP/bench-tree" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Cold-cache comparison
        run: bench/cold.sh /System/Library 3 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Profile system calls per directory
        run: |
          cc -O2 -o "$RUNNER_TEMP/syscalls" bench/syscalls.c
          "$RUNNER_TEMP/syscalls" "$RUNNER_TEMP/bench-tree" "$(sysctl -n hw.ncpu)" | tee -a "$GITHUB_STEP_SUMMARY"

  # Ubuntu packages ncdu 1.x, which has no -t, so this uses the official static
  # ncdu 2.x build. The checksum pins the release, whose PGP signature by
  # Yoran Heling (7446 0D32 B808 10EB A9AF A2E9 6239 4C69 8C27 39FA) was checked.
  benchmark-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install ncdu 2.9.1
        run: |
          curl -sSfL -o "$RUNNER_TEMP/ncdu.tar.gz" https://dev.yorhel.nl/download/ncdu-2.9.1-linux-x86_64.tar.gz
          echo "0c6c84b3f763c33baa051c8327f0e736f46f33a8cc061bb951d24517a8c5d73e  $RUNNER_TEMP/ncdu.tar.gz" | sha256sum -c -
          tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/ncdu.tar.gz"
          "$RUNNER_TEMP/ncdu" --version
      - name: Compare totals with du on /usr
        run: MINIMENTA_DU_TREE=/usr cargo test --release -- --ignored --nocapture totals_match_du_on_a_real_tree 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
      - run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          NCDU="$RUNNER_TEMP/ncdu" bench/throughput.sh "$RUNNER_TEMP/bench-tree" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Cold-cache comparison
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          NCDU="$RUNNER_TEMP/ncdu" bench/cold.sh /usr 3 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Profile system calls per directory
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq liburing-dev
          cc -O2 -o "$RUNNER_TEMP/syscalls_linux" bench/syscalls_linux.c -luring
          "$RUNNER_TEMP/syscalls_linux" "$RUNNER_TEMP/bench-tree" "$(nproc)" | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  benchmark-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install gdu 5.38.0 and dua-cli 2.45.1
        run: |
          t=$(cygpath -m "$RUNNER_TEMP")
          curl -sSfL -o "$t/gdu.zip" https://github.com/dundee/gdu/releases/download/v5.38.0/gdu_windows_amd64.exe.zip
          echo "22e6616e0bdc25d8d803934b4d3189996ebf74de8ac9b3635a4e4e079c3d7f8a  $t/gdu.zip" | sha256sum -c -
          curl -sSfL -o "$t/dua.zip" https://github.com/Byron/dua-cli/releases/download/v2.45.1/dua-v2.45.1-x86_64-pc-windows-msvc.zip
          echo "48c245f987c5359df0302202e6338e3235e4a4724db58d7d66138b096e8b2015  $t/dua.zip" | sha256sum -c -
          mkdir -p "$t/tools" && unzip -q -o "$t/gdu.zip" -d "$t/tools" && unzip -q -o -j "$t/dua.zip" -d "$t/tools"
          ls "$t/tools"
      - name: Compare with gdu and dua-cli (warm)
        run: |
          t=$(cygpath -m "$RUNNER_TEMP")
          python -I bench/gen_tree.py "$t/bench-tree"
          export GDU="$t/tools/gdu_windows_amd64.exe" DUA="$t/tools/dua.exe"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "-- MFT correctness without the volume flush" | tee -a "$GITHUB_STEP_SUMMARY"
          for i in 1 2 3; do MINIMENTA_MFT_NOFLUSH=1 cargo test --release -q the_master_file_table 2>&1 | grep -E "test result|panicked|skipped" | tee -a "$GITHUB_STEP_SUMMARY"; done
          bench/windows-race.sh "$t/bench-tree" 30 0 | tee -a "$GITHUB_STEP_SUMMARY"
          bench/windows-race.sh "C:/Program Files" 10 3 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
