[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.33.0"
ci = "github"
installers = ["shell", "powershell", "homebrew"]
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
tap = "OriginalMHV/homebrew-tap"
# scripts/release.sh publishes the crate to crates.io, as in Ward.
publish-jobs = ["homebrew"]
pr-run-mode = "plan"

# GitHub retires the macOS 14 images on 2026-11-02, and dist 0.33.0 still
# picks macos-14 for Apple silicon. The v0.2.0 build failed in a brownout.
[dist.github-custom-runners]
aarch64-apple-darwin = "macos-15"
