<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"><style>.fg{fill:#1F2328}.mu{fill:#59636E}.ac{fill:#1A7F5A}.bar{fill:#8C959F}@media (prefers-color-scheme: dark){.fg{fill:#F0F6FC}.mu{fill:#9198A1}.ac{fill:#44B78F}.bar{fill:#6E7681}}</style><text x="40" y="34" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" class="fg">First scan of a cold disk</text><text x="40" y="60" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" class="mu">Speed relative to ncdu with its default settings. Longer is faster.</text><text x="40" y="104" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" class="mu">macOS</text><text x="40" y="140" font-size="22" class="fg">minimenta</text><text x="230" y="140" font-size="22" class="fg">5.3x</text><text x="310" y="140" font-size="22" xml:space="preserve" class="mu">[<tspan class="ac">####################</tspan>]</text><text x="40" y="176" font-size="22" class="mu">ncdu -t 64</text><text x="230" y="176" font-size="22" class="mu">4.6x</text><text x="310" y="176" font-size="22" xml:space="preserve" class="mu">[<tspan class="bar">#################</tspan>   ]</text><text x="40" y="212" font-size="22" class="mu">ncdu</text><text x="230" y="212" font-size="22" class="mu">1.0x</text><text x="310" y="212" font-size="22" xml:space="preserve" class="mu">[<tspan class="bar">####</tspan>                ]</text><text x="40" y="256" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" class="mu">Linux</text><text x="40" y="292" font-size="22" class="fg">minimenta</text><text x="230" y="292" font-size="22" class="fg">4.5x</text><text x="310" y="292" font-size="22" xml:space="preserve" class="mu">[<tspan class="ac">###################</tspan> ]</text><text x="40" y="328" font-size="22" class="mu">ncdu -t 64</text><text x="230" y="328" font-size="22" class="mu">4.7x</text><text x="310" y="328" font-size="22" xml:space="preserve" class="mu">[<tspan class="bar">####################</tspan>]</text><text x="40" y="364" font-size="22" class="mu">ncdu</text><text x="230" y="364" font-size="22" class="mu">1.0x</text><text x="310" y="364" font-size="22" xml:space="preserve" class="mu">[<tspan class="bar">####</tspan>                ]</text><text x="40" y="412" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" class="mu">File cache dropped before every run (bench/cold.sh), interleaved runs, CI runners.</text><text x="40" y="436" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" class="mu">macOS: 3 cores, /System/Library, 427,124 items. Linux: 4 cores, /usr, 737,881 items.</text><text x="40" y="460" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" class="mu">Only a few runs per pair: expect differences of about 10% between runs.</text></svg>
